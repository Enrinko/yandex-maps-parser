server {
    listen 80;
    server_name _;
    client_max_body_size 8m;

    root /usr/share/nginx/html;
    index index.html;

    # --- Laravel API (single origin → Sanctum cookie auth, no CORS) ---
    location ~ ^/(api|sanctum|login|logout|up) {
        # All Laravel requests hit the front controller via php-fpm.
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param PATH_INFO $request_uri;
        fastcgi_read_timeout 300;
    }

    # --- SPA: history-mode fallback to index.html ---
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }
}
