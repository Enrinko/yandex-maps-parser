services:
  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      - app
    restart: unless-stopped

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      RUN_MIGRATIONS: "true"
      APP_NAME: "Yandex Maps Reviews"
      APP_ENV: ${APP_ENV:-local}
      APP_KEY: ${APP_KEY:-base64:z/DoTyY3fi2rGR4zvCfL7DJ4VC9qZ1OXltLkVBnb9i0=}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost:8080}
      APP_LOCALE: ru
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-yandex}
      DB_USERNAME: ${DB_USERNAME:-yandex}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:-localhost:8080,localhost,localhost:5173,127.0.0.1}
      SESSION_DOMAIN: ${SESSION_DOMAIN:-localhost}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      SCRAPER_URL: http://scraper:3000
      SCRAPER_PROXY: ${SCRAPER_PROXY:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  queue:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: php artisan queue:work --tries=3 --timeout=300 --sleep=3
    environment:
      RUN_MIGRATIONS: "false"
      APP_NAME: "Yandex Maps Reviews"
      APP_ENV: ${APP_ENV:-local}
      APP_KEY: ${APP_KEY:-base64:z/DoTyY3fi2rGR4zvCfL7DJ4VC9qZ1OXltLkVBnb9i0=}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost:8080}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-yandex}
      DB_USERNAME: ${DB_USERNAME:-yandex}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      SCRAPER_URL: http://scraper:3000
      SCRAPER_PROXY: ${SCRAPER_PROXY:-}
      SCRAPER_TIMEOUT: ${SCRAPER_TIMEOUT:-240}
    depends_on:
      app:
        condition: service_started
      redis:
        condition: service_healthy
      scraper:
        condition: service_started
    restart: unless-stopped

  scraper:
    build:
      context: ./scraper
      dockerfile: Dockerfile
    environment:
      PORT: 3000
    restart: unless-stopped
    # Chromium needs more shared memory than the 64MB default.
    shm_size: "1gb"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('http').get('http://localhost:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-yandex}
      MYSQL_USER: ${DB_USERNAME:-yandex}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD:-rootsecret}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  db-data:
  redis-data:
